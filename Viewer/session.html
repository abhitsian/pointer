<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: oklch(97.2% 0.011 75);
  --paper-2: oklch(94.6% 0.016 72);
  --ink: oklch(23% 0.012 60);
  --ink-2: oklch(40% 0.018 62);
  --ink-3: oklch(56% 0.02 66);
  --line: oklch(89% 0.018 72);
  --tan: oklch(77% 0.085 70);
  --tan-wash: oklch(91% 0.04 75);
  --ember: oklch(58% 0.145 48);
  --stage: oklch(17% 0.01 60);
  --shadow: 0 1px 1px oklch(30% 0.03 60 / 0.06), 0 6px 18px -8px oklch(30% 0.04 60 / 0.22), 0 22px 44px -28px oklch(30% 0.05 60 / 0.35);
  --ui: "Hanken Grotesk", ui-sans-serif, sans-serif;
  --voice: "Newsreader", "Iowan Old Style", Georgia, serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: oklch(17.5% 0.01 60);
    --paper-2: oklch(21.5% 0.012 62);
    --ink: oklch(93% 0.012 75);
    --ink-2: oklch(78% 0.016 72);
    --ink-3: oklch(62% 0.02 68);
    --line: oklch(29% 0.014 62);
    --tan-wash: oklch(30% 0.035 65);
    --ember: oklch(72% 0.13 55);
    --stage: oklch(11% 0.008 60);
    --shadow: 0 1px 1px oklch(0% 0 0 / 0.3), 0 10px 30px -12px oklch(0% 0 0 / 0.6);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.5 var(--ui); font-feature-settings: "ss01";
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 4px; }
.num, time, .stamp, .scale { font-variant-numeric: tabular-nums; }

/* Top bar */
.bar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px;
  height: 54px; padding: 0 clamp(16px, 3vw, 40px);
  background: var(--paper); box-shadow: 0 1px 0 var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -0.01em; text-decoration: none; }
.brand svg { width: 22px; height: 17px; color: var(--ember); }
.crumb { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.actions { margin-left: auto; display: flex; gap: 6px; }
.action {
  display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px;
  font-size: 13.5px; font-weight: 550; color: var(--ink-2); text-decoration: none;
  transition: background-color .15s ease, color .15s ease;
}
.action:hover { background: var(--paper-2); color: var(--ink); }
.action.primary { background: var(--ink); color: var(--paper); }
.action.primary:hover { background: var(--ink-2); color: var(--paper); }

/* Layout */
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 430px);
  gap: clamp(28px, 3.4vw, 56px); max-width: 1560px; margin: 0 auto;
  padding: clamp(20px, 2.6vw, 36px) clamp(16px, 3vw, 40px) 80px;
}
.stage-col { position: sticky; top: 78px; align-self: start; }
.eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ember); }
h1 { margin: 0; font-size: clamp(25px, 2.3vw, 33px); line-height: 1.12; font-weight: 650; letter-spacing: -0.02em; text-wrap: balance; }
.meta { margin: 8px 0 20px; color: var(--ink-3); font-size: 14px; }
.meta span + span::before { content: "·"; margin: 0 8px; color: var(--line); }

.stage { position: relative; border-radius: 14px; overflow: hidden; background: var(--stage); box-shadow: var(--shadow); isolation: isolate; }
.stage video, .stage > img { display: block; width: 100%; max-height: calc(100vh - 330px); object-fit: contain; background: var(--stage); }
.stage-note { padding: 40px 28px; color: oklch(85% 0.012 75); font-size: 14px; }
.stage-note a { color: var(--tan); }
video::cue { font-family: var(--ui); font-size: 0.95em; background: oklch(15% 0.01 60 / 0.78); }

/* Tape: the timeline under the video */
.tape { margin-top: 18px; }
.track { position: relative; height: 76px; border-radius: 10px; background: var(--paper-2); cursor: pointer; }
.track::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.speech { position: absolute; bottom: 8px; height: 4px; border-radius: 2px; background: var(--tan); opacity: .9; }
.tick { position: absolute; top: 5px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid var(--ember); transform: translateX(-4px); }
.pin {
  position: absolute; top: 14px; height: 44px; aspect-ratio: 16 / 10; translate: calc(var(--p) * -1) 0; transform-origin: 50% 100%;
  border-radius: 5px; overflow: hidden; background: var(--stage); z-index: 1;
  box-shadow: 0 0 0 1.5px var(--paper), 0 2px 6px -2px oklch(20% 0.03 60 / 0.4);
  transition: scale .2s cubic-bezier(.22, 1, .36, 1), translate .2s cubic-bezier(.22, 1, .36, 1), box-shadow .2s ease;
}
.pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pin:hover { translate: calc(var(--p) * -1) -4px; scale: 1.9; z-index: 3; }
.pin.on { box-shadow: 0 0 0 2px var(--ember), 0 3px 10px -3px oklch(40% 0.12 45 / 0.6); z-index: 2; }
.head { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; z-index: 4; pointer-events: none; will-change: transform; }
.scale { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
.legend { display: flex; gap: 16px; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.legend .k-click { border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid var(--ember); }
.legend .k-talk { width: 14px; height: 4px; border-radius: 2px; background: var(--tan); }

/* Story: the talk track */
.story h2 { margin: 2px 0 18px; font-size: 13px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.request { margin: 0 0 28px; font: italic 500 21px/1.38 var(--voice); letter-spacing: -0.005em; text-wrap: pretty; }
.request::before { content: "You asked"; display: block; margin-bottom: 4px; font: 600 12px/1 var(--ui); letter-spacing: .09em; text-transform: uppercase; font-style: normal; color: var(--ember); }
.request.plain::before { content: none; }
.beats { list-style: none; margin: 0; padding: 0; }
.beat { position: relative; padding: 0 0 30px 26px; opacity: 0; animation: rise .5s cubic-bezier(.22, 1, .36, 1) forwards; }
.beat::before { content: ""; position: absolute; left: 6px; top: 22px; bottom: 0; width: 1px; background: var(--line); }
.beat:last-child::before { display: none; }
.dot { position: absolute; left: 1px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink-3); transition: box-shadow .2s ease; }
.beat.on .dot { box-shadow: inset 0 0 0 6px var(--ember); }
.beat-head { margin: 0 0 10px; font-size: 14px; line-height: 1.45; color: var(--ink-2); text-wrap: pretty; }
.beat-head .num { font-weight: 650; color: var(--ink); margin-right: 6px; }
.beat.on .beat-head .num { color: var(--ember); }
.beat-head b { font-weight: 600; color: var(--ink); }
.shot { position: relative; display: block; width: 100%; border-radius: 10px; overflow: hidden; background: var(--stage); box-shadow: 0 0 0 1px var(--line); transition: box-shadow .2s ease; }
.shot img { display: block; width: 100%; height: auto; }
.beat.on .shot { box-shadow: 0 0 0 2px var(--ember), var(--shadow); }
.stamp { position: absolute; left: 8px; bottom: 8px; padding: 2px 7px; border-radius: 6px; font-size: 12px; font-weight: 600; color: oklch(96% 0.01 75); background: oklch(17% 0.01 60 / 0.78); }
.lines { list-style: none; margin: 12px 0 0; padding: 0; }
.line button { display: grid; grid-template-columns: 38px 1fr; gap: 8px; width: 100%; padding: 6px 8px 6px 0; text-align: left; border-radius: 8px; transition: background-color .15s ease; }
.line button:has(.who) { grid-template-columns: 38px auto 1fr; }
.who { padding-top: 3px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.who.you { color: var(--ember); }
.where { color: var(--ink-3); }
.digest { margin: 0 0 30px; }
.digest h3 { margin: 22px 0 8px; font-size: 12px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ember); }
.digest h3:first-child { margin-top: 0; }
.digest p { margin: 0 0 10px; font-size: 15px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }
.digest ul { margin: 0 0 10px; padding: 0; list-style: none; }
.digest li { position: relative; margin-bottom: 7px; padding-left: 14px; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); text-wrap: pretty; }
.digest li::before { content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--tan); }
.stamp-link { font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 650; color: var(--ember); padding: 0 2px; }
.stamp-link:hover { text-decoration: underline; }
.line button:hover { background: var(--paper-2); }
.line time { padding-top: 3px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.line q { font: italic 400 17px/1.42 var(--voice); color: var(--ink-2); quotes: none; text-wrap: pretty; transition: color .2s ease; }
.line.on q { color: var(--ink); }
.line.on time { color: var(--ember); }
.silent { margin: 10px 0 0; font-size: 13.5px; color: var(--ink-3); }
.changes { margin: 12px 0 0; }
.changes summary { display: flex; align-items: baseline; gap: 10px; cursor: pointer; list-style: none; font-size: 13px; }
.changes summary::-webkit-details-marker { display: none; }
.changes summary::after { content: "Show all"; margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
.changes[open] summary::after { content: "Hide"; }
.changes .label { font-size: 11.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.count { font-weight: 600; font-variant-numeric: tabular-nums; }
.count.new { color: var(--ember); }
.count.gone { color: var(--ink-3); }
.peek, .all ul { list-style: none; margin: 6px 0 0; padding: 0; }
.peek li, .all li { padding: 2px 0 2px 10px; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); box-shadow: inset 2px 0 0 var(--tan-wash); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.changes[open] + .peek { display: none; }
.all-title { margin: 12px 0 0; font-size: 11.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.all .gone li { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line); }
.all li { white-space: normal; }
.silent.lead { margin: -8px 0 22px; }
.doc-text { margin: 8px 0 0; padding: 22px 24px; border-radius: 12px; background: var(--paper-2); font-size: 14.5px; line-height: 1.6; max-height: 70vh; overflow: auto; }
.doc-text p { margin: 0; }
.doc-text p:empty { height: .8em; }
.got { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.got summary { cursor: pointer; font-size: 13px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); list-style: none; }
.got summary::-webkit-details-marker { display: none; }
.got summary::after { content: " +"; }
.got[open] summary::after { content: " –"; }
.got pre { margin: 12px 0 0; padding: 16px; border-radius: 10px; background: var(--paper-2); font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; color: var(--ink-2); }
.hint { margin-top: 26px; font-size: 12.5px; color: var(--ink-3); }
kbd { font: 600 11.5px/1 var(--ui); padding: 2px 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line), 0 1px 0 var(--line); }
/* Playback controls */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.ctl { height: 30px; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 550; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
.ctl:hover { background: var(--paper-2); color: var(--ink); }
.ctl.on { background: var(--ink); color: var(--paper); box-shadow: none; }
.controls .gap { flex: 1; }
.now { margin: 12px 0 0; min-height: 1.4em; font: italic 400 16px/1.45 var(--voice); color: var(--ink-2); }
.now time { font: 600 12px var(--ui); font-style: normal; color: var(--ember); margin-right: 8px; }

/* Ask */
.ask { margin: 0 0 18px; padding: 14px; border-radius: 12px; background: var(--paper-2); }
.ask-label { display: block; margin: 0 0 8px; font-size: 12px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ember); }
.ask-row { display: flex; gap: 8px; align-items: flex-end; }
.ask textarea { flex: 1; min-height: 38px; max-height: 160px; resize: none; padding: 9px 11px; border: 0; border-radius: 9px; font: 400 14.5px/1.4 var(--ui); color: var(--ink); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
.ask textarea:focus { outline: 2px solid var(--ember); outline-offset: 0; }
.ask .action.primary { height: 38px; }
.ask .action.primary:disabled { opacity: .55; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { padding: 4px 10px; border-radius: 999px; font-size: 12.5px; color: var(--ink-2); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
.chip:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-3); }
.ask-note { margin: 10px 0 0; font-size: 13px; color: var(--ink-3); }
.answers { list-style: none; margin: 0 0 22px; padding: 0; }
.answer { margin: 0 0 14px; padding: 0 0 14px; border-bottom: 1px solid var(--line); }
.answer .q { margin: 0 0 6px; font-weight: 600; font-size: 14.5px; color: var(--ink); }
.answer .q time { font-weight: 500; font-size: 12px; color: var(--ink-3); margin-left: 6px; }
.answer .a p, .answer .a li { font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
.answer .a p { margin: 0 0 8px; }
.answer .a ul { margin: 0 0 8px; padding-left: 18px; }
.answer .a h3 { margin: 10px 0 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.answer.pending .a { color: var(--ink-3); font-size: 14px; }
.answer.failed .a { color: var(--ember); font-size: 14px; }
.answers .more { font-size: 13px; color: var(--ink-3); }

/* Tabs and panes */
.tabs { display: flex; gap: 4px; margin: 0 0 18px; border-bottom: 1px solid var(--line); }
.tab { padding: 8px 12px; margin-bottom: -1px; font-size: 13.5px; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--ember); }
.tab .n { font-weight: 500; color: var(--ink-3); margin-left: 5px; font-variant-numeric: tabular-nums; }
.find { width: 100%; height: 36px; padding: 0 12px; border: 0; border-radius: 9px; font: 400 14px var(--ui); color: var(--ink); background: var(--paper-2); }
.find:focus { outline: 2px solid var(--ember); outline-offset: 0; }
.found { margin: 8px 0 6px; font-size: 12.5px; color: var(--ink-3); }
.script { position: relative; list-style: none; margin: 0; padding: 0 4px 0 0; max-height: calc(100vh - 230px); overflow: auto; overscroll-behavior: contain; }
.script .line q { font-size: 16px; }
mark { background: var(--tan-wash); color: var(--ink); border-radius: 3px; padding: 0 1px; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .beat { animation: none; opacity: 1; } .pin, .pin:hover { transition: none; } }
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  .stage-col { position: static; }
  .stage video, .stage > img { max-height: 60vh; }
}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" id="home" href="../index.html">
    <svg viewBox="-0.6 -0.6 25.2 19" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.8V1h5.5M16.5 1H22v3.8M22 9.2V13h-5.5M7.5 13H2V9.2"/></g><path d="M3.2 13 1.4 17.6 8.2 13z" fill="currentColor"/><circle cx="12" cy="7" r="2.7" fill="currentColor"/></svg>
    Pointer
  </a>
  <nav class="actions">
    <button class="action" id="context" type="button">Copy for Claude</button>
    <button class="action" id="copy" type="button">Copy what Claude got</button>
    <a class="action" id="file" href="#">Video file</a>
  </nav>
</header>

<main class="layout">
  <section class="stage-col">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
    <div class="stage" id="stage"></div>
    <div class="tape" id="tape" hidden>
      <div class="track" id="track"><div class="head" id="head"></div></div>
      <div class="scale"><span id="t0">0:00</span><span class="legend"><span><i class="k-click"></i>Click</span><span><i class="k-talk"></i>Talking</span></span><span id="t1"></span></div>
    </div>
    <div class="controls" id="controls" hidden>
      <button class="ctl" type="button" data-skip="-10" title="Back 10 seconds (J)">−10 s</button>
      <button class="ctl" type="button" data-skip="10" title="Forward 10 seconds (L)">+10 s</button>
      <span class="gap"></span>
      <button class="ctl" type="button" data-rate="1">1×</button>
      <button class="ctl" type="button" data-rate="1.25">1.25×</button>
      <button class="ctl" type="button" data-rate="1.5">1.5×</button>
      <button class="ctl" type="button" data-rate="2">2×</button>
      <button class="ctl" type="button" id="moment" title="Copy a link to this moment, for chat">Copy moment</button>
    </div>
    <p class="now" id="now" hidden></p>
    <p class="hint" id="hint"><kbd>Space</kbd> play or pause · <kbd>J</kbd> <kbd>L</kbd> back or forward 10 s · <kbd>←</kbd> <kbd>→</kbd> previous or next frame · <kbd>/</kbd> search the transcript · click any timestamp, frame or line to play from there</p>
  </section>

  <aside class="story">
    <form class="ask" id="ask" hidden>
      <label class="ask-label" for="q">Ask about this session</label>
      <div class="ask-row">
        <textarea id="q" rows="1" placeholder="Where did they explain the main idea?"></textarea>
        <button class="action primary" id="ask-go" type="submit">Ask</button>
      </div>
      <div class="chips" id="chips"></div>
      <p class="ask-note" id="ask-note" hidden></p>
    </form>
    <ol class="answers" id="answers"></ol>
    <nav class="tabs" id="tabs" hidden></nav>
    <section class="pane" data-pane="notes"><div id="request"></div></section>
    <section class="pane" data-pane="transcript" hidden>
      <input class="find" id="find" type="search" placeholder="Search what was said" autocomplete="off">
      <p class="found" id="found"></p>
      <ol class="script" id="script"></ol>
    </section>
    <section class="pane" data-pane="frames">
      <h2 id="story-title">Talk track</h2>
      <ol class="beats" id="beats"></ol>
    </section>
    <div id="doc"></div>
    <details class="got" id="got"><summary>What Claude got</summary><pre id="summary"></pre></details>
  </aside>
</main>

<script id="data" type="application/json">__SESSION_JSON__</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("data").textContent);
  let activeBeat = -1, activeLine = null, userScrolledAt = 0;
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const clock = (t) => {
    t = Math.floor(Math.max(0, t || 0));
    const two = (n) => String(n).padStart(2, "0");
    return t >= 3600 ? `${Math.floor(t / 3600)}:${two(Math.floor(t % 3600 / 60))}:${two(t % 60)}` : `${Math.floor(t / 60)}:${two(t % 60)}`;
  };
  const kinds = { video: "Screen recording", document: "Document", screenshot: "Screenshot", watch: "Watch session", listen: "Listen & ask session" };
  const unit = data.kind === "document" ? ["page", "pages"] : ["frame", "frames"];
  const plural = (n, [one, many]) => `${n} ${n === 1 ? one : many}`;

  // Still being written up: say so and reload until the finished page replaces this one.
  if (data.processing) {
    const note = el("p", null, "Processing this session. Frames, transcript and write-up appear here when it finishes; this page refreshes by itself.");
    note.style.cssText = "margin: 24px auto; max-width: 640px; padding: 14px 18px; border-radius: 10px; background: var(--stage, #eee);";
    document.querySelector("main").prepend(note);
    setTimeout(() => location.reload(), 10000);
  }

  // Heading
  const created = new Date(data.created);
  const when = created.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });

  // A watch session's write-up sits above the talk track; its timestamps jump the video.
  const parseClock = (stamp) => stamp.split(":").reverse().reduce((total, part, i) => total + Number(part) * 60 ** i, 0);

  // Light Markdown (headings, bullet and numbered lists, paragraphs) with clickable timestamps.

  data.frames.forEach((frame, i) => {

    if (cues.length) {

      const li = el("li", "line");

      b.append(el("time", null, clock(frame.time)), el("q", null, frame.said));

    } else if (data.kind !== "document" && words) {

    }

      const box = el("details", "changes");

      if (frame.appeared.length) summary.append(el("span", "count new", `+${frame.appeared.length} new`));
      if (frame.gone.length) summary.append(el("span", "count gone", `−${frame.gone.length} gone`));
      box.append(summary);
      const peek = el("ul", "peek");
      frame.appeared.slice(0, 3).forEach((t) => peek.append(Object.assign(el("li", null, t), { title: t })));
      const all = el("div", "all");
      const list = (title, items, cls) => {
        if (!items.length) return;
        all.append(el("p", "all-title", title));
        const ul = el("ul", cls);
        items.forEach((t) => ul.append(el("li", null, t)));
        all.append(ul);
      };

    }

    beats.append(beat);
    beatEls.push(beat);
  });

  if (data.kind === "screenshot") {
    const said = data.narration ? el("p", "request plain", data.narration) : el("p", "silent", "Nothing was said with this screenshot.");
    beats.replaceWith(said);
  }

  if (data.documentLines && data.documentLines.length) {
    const doc = $("#doc");
    doc.append(el("h2", null, `Text read from the screen · ${data.documentLines.length} lines`));
    const box = el("div", "doc-text");
    data.documentLines.forEach((line) => box.append(el("p", null, line)));
    doc.append(box);
  }

  if (data.summary) $("#summary").textContent = data.summary; else $("#got").remove();
  $("#copy").addEventListener("click", async () => {
    const text = data.summary || data.narration || "";
    try { await navigator.clipboard.writeText(text); }
    catch { const t = el("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
    $("#copy").textContent = "Copied";
    setTimeout(() => ($("#copy").textContent = "Copy what Claude got"), 1600);
  });
  if (!data.summary && !data.narration) $("#copy").remove();

  // Everything about this session as one block, for pasting into any Claude conversation.
  $("#context").addEventListener("click", async () => {
    const lines = [`${kinds[data.kind]}: ${data.title || when} (${when}${data.seconds ? `, ${Math.round(data.seconds)} s` : ""})`];
    if (data.digest) lines.push("", data.digest);
    if (data.cues.length) {
      lines.push("", "Transcript:");
      data.cues.forEach((c) => lines.push(`[${clock(c.start)}] ${c.speaker ? c.speaker + ": " : ""}${c.text}`));
    } else if (data.narration) {
      lines.push("", `Said: ${data.narration}`);
    }
    const onScreen = data.frames.filter((f) => f.appeared.length || f.context);
    if (onScreen.length) {
      lines.push("", "On screen:");
      onScreen.forEach((f) => lines.push(`[${clock(f.time)}] ${f.context || ""}${f.appeared.length ? ` — ${f.appeared.slice(0, 8).join(" | ")}` : ""}`));
    }
    if (data.documentLines) lines.push("", "Document text:", data.documentLines.join("\n"));
    lines.push("", `Frames and files: ${location.href.replace(/index\.html$/, "")}`);
    const text = lines.join("\n");
    try { await navigator.clipboard.writeText(text); }
    catch { const box = el("textarea"); box.value = text; document.body.append(box); box.select(); document.execCommand("copy"); box.remove(); }
    $("#context").textContent = "Copied";
    setTimeout(() => ($("#context").textContent = "Copy for Claude"), 1600);
  });

  // Tabs: the write-up, the whole transcript, and the frames. Pages with one of these show it without tabs.
  const panes = [...document.querySelectorAll(".pane")];
  const tabs = [
    data.digest && ["notes", "Notes", null],
    data.cues.length > 0 && ["transcript", "Transcript", data.cues.length],
    data.kind !== "screenshot" && data.frames.length > 0 && ["frames", "Frames", data.frames.length],
  ].filter(Boolean);
  function showPane(name) {
    panes.forEach((p) => (p.hidden = p.dataset.pane !== name));
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.pane === name));
    try { localStorage.setItem("pointer-tab", name); } catch {}
    if (name === "transcript") requestAnimationFrame(() => centre(scriptLine));
  }
  if (video && tabs.length > 1) {
    const nav = $("#tabs");
    nav.hidden = false;
    tabs.forEach(([name, label, n]) => {
      const b = el("button", "tab", label);
      b.type = "button"; b.dataset.pane = name;
      if (n) b.append(el("span", "n", n));
      b.addEventListener("click", () => showPane(name));
      nav.append(b);
    });
    let saved = null;
    try { saved = localStorage.getItem("pointer-tab"); } catch {}
    showPane(tabs.some((t) => t[0] === saved) ? saved : tabs[0][0]);
  } else {
    panes.forEach((p) => (p.hidden = false));
  }

  // Transcript: every line, searchable; the line being spoken is marked and kept in view.
  const scriptEls = [];
  let scriptLine = null;
  if (data.cues.length) {
    const list = $("#script");
    data.cues.forEach((c) => {
      const li = el("li", "line");
      const b = el("button"); b.type = "button";
      b.append(el("time", null, clock(c.start)));
      if (c.speaker) b.append(el("span", `who ${c.speaker.toLowerCase()}`, c.speaker));

          const text = li._text, lower = text.toLowerCase();

          li.hidden = words.length > 0 && !hit;
          li._q.replaceChildren();
          if (!words.length || !hit) { li._q.textContent = text; return; }

    const setRate = (r) => {

    });

  // Ask: questions about this session, answered by Claude from its notes, transcript and screen text.

  const history = (data.asks || []).map((a) => ({ question: a.question, answer: a.answer }));
  function answerEl(question, at) {

    li.append(q, el("div", "a"));
    return li;
  }
  if (askable) {
    $("#ask").hidden = false;
    (data.asks || []).slice().reverse().forEach((a, i) => {
      const li = answerEl(a.question, a.at);
      markdown(a.answer, li.querySelector(".a"));

      answers.append(li);
    });
    if ((data.asks || []).length > 3) {
      const more = el("button", "more", `Show ${data.asks.length - 3} earlier questions`);
      more.type = "button";
      more.addEventListener("click", () => { answers.querySelectorAll(".answer").forEach((n) => (n.hidden = false)); more.remove(); });
      answers.append(more);
    }
    const q = $("#q"), go = $("#ask-go");
    const grow = () => { q.style.height = "auto"; q.style.height = `${Math.min(160, q.scrollHeight)}px`; };
    q.addEventListener("input", grow);
    q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ask").requestSubmit(); } });
    const suggestions = data.kind === "watch" || data.kind === "listen"
      ? ["What were the main points?", "What should I act on?", "Which parts are worth replaying?"]
      : ["What happens in this recording?", "What was said about the screen?"];
    suggestions.forEach((text) => {
      const c = el("button", "chip", text); c.type = "button";
      c.addEventListener("click", () => { q.value = text; $("#ask").requestSubmit(); });
      $("#chips").append(c);
    });
    if (!bridge) {
      const note = $("#ask-note");
      note.hidden = false;
      note.textContent = "Asking runs in Pointer's own window. In a browser, use Copy for Claude and paste it into a chat.";
      go.disabled = true;
    }
    $("#ask").addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = q.value.trim();
      if (!question || !bridge || go.disabled) return;
      const li = answerEl(question, Date.now());
      li.classList.add("pending");
      li.querySelector(".a").textContent = "Reading the session…";
      answers.prepend(li);
      q.value = ""; grow();
      go.disabled = true;
      const started = performance.now();
      const tick = setInterval(() => { li.querySelector(".a").textContent = `Reading the session… ${Math.round((performance.now() - started) / 1000)} s`; }, 1000);
      try {
        const answer = await bridge.postMessage({ question, history: history.slice(-6) });
        li.classList.remove("pending");
        li.querySelector(".a").replaceChildren();
        markdown(String(answer), li.querySelector(".a"));
        history.push({ question, answer: String(answer) });
      } catch (err) {
        li.classList.remove("pending");
        li.classList.add("failed");
        li.querySelector(".a").textContent = String(err && err.message || err);
      } finally {
        clearInterval(tick);
        go.disabled = false;
      }
    });
  }

  // Tape
  if (video) {
    const track = $("#track");
    $("#tape").hidden = false;
    const place = () => {
      const d = duration();
      $("#t1").textContent = clock(d);
      track.querySelectorAll(".pin, .tick, .speech").forEach((n) => n.remove());
      const pct = (t) => `${Math.min(100, Math.max(0, (t / d) * 100))}%`;
      data.cues.forEach((c) => { const s = el("span", "speech"); s.style.left = pct(c.start); s.style.width = `calc(${pct(Math.min(c.end, d))} - ${pct(c.start)})`; track.append(s); });
      data.clicks.forEach((c) => { const t = el("span", "tick"); t.style.left = pct(c.time); t.title = `${clock(c.time)} clicked ${c.target}`; track.append(t); });
      data.frames.forEach((f, i) => {
        const pin = el("button", "pin");
        pin.type = "button";
        pin.style.left = pct(f.time);
        pin.style.setProperty("--p", pct(f.time));
        pin.title = `${unit[0][0].toUpperCase() + unit[0].slice(1)} ${i + 1} · ${clock(f.time)}`;
        pin.append(Object.assign(el("img"), { src: f.file, alt: "" }));
        pin.addEventListener("click", (e) => { e.stopPropagation(); seek(f.time + 0.02, false); });
        track.append(pin);
      });

    };
    place();
    video.addEventListener("loadedmetadata", place);
    track.addEventListener("click", (e) => {
      const r = track.getBoundingClientRect();
      seek(((e.clientX - r.left) / r.width) * duration(), false);
    });
  }


  // Playback sync
  addEventListener("wheel", () => (userScrolledAt = performance.now()), { passive: true });
  addEventListener("touchmove", () => (userScrolledAt = performance.now()), { passive: true });
  function sync() {
    if (!video) return;
    const t = video.currentTime;
    const head = $("#head");
    const track = $("#track");
    if (head && track) head.style.transform = `translateX(${(Math.min(t, duration()) / duration()) * track.clientWidth}px)`;
    let b = -1;
    data.frames.forEach((f, i) => { if (f.time <= t + 0.05) b = i; });
    if (b !== activeBeat) {
      beatEls.forEach((n, i) => n.classList.toggle("on", i === b));
      document.querySelectorAll(".pin").forEach((n, i) => n.classList.toggle("on", i === b));
      activeBeat = b;
      if (!video.paused && beatEls[b] && !beatEls[b].closest(".pane").hidden && performance.now() - userScrolledAt > 3000) beatEls[b].scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    follow(t);
    const line = lineEls.find((n) => t >= +n.dataset.start && t < +n.dataset.end) || null;
    if (line !== activeLine) {
      activeLine?.classList.remove("on");
      line?.classList.add("on");
      activeLine = line;
    }
  }
  function seek(t, play) {
    if (!video) return;
    video.currentTime = Math.max(0, t);
    if (play) video.play().catch(() => {});
    sync();
  }
  if (video) {
    let raf = 0;
    const loop = () => { sync(); raf = requestAnimationFrame(loop); };
    video.addEventListener("play", () => { cancelAnimationFrame(raf); loop(); });
    video.addEventListener("pause", () => { cancelAnimationFrame(raf); sync(); });
    video.addEventListener("seeked", sync);
    video.addEventListener("timeupdate", sync);
    addEventListener("resize", sync);
    addEventListener("keydown", (e) => {
      if (e.target.closest("input, textarea")) return;
      if (e.key === " " && e.target === document.body) { e.preventDefault(); video.paused ? video.play() : video.pause(); }
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        e.preventDefault();
        const t = video.currentTime;
        const target = e.key === "ArrowRight" ? data.frames.find((f) => f.time > t + 0.1) : [...data.frames].reverse().find((f) => f.time < t - 0.3);
        seek(target ? target.time + 0.02 : e.key === "ArrowLeft" ? 0 : t, false);
      }
    });
    sync();
  }
})();
</script>
</body>
</html>
